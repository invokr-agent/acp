version: "2"
linters:
  # The same complexity limits invokr keeps.
  enable: [gocyclo, gocognit, funlen, nestif, dupl, misspell]
  settings:
    gocyclo:
      min-complexity: 12
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 5
    dupl:
      threshold: 100
